<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat en tiempo real mediante WebSockets con Socket.IO, Firebase Auth y JWT">
    <title>ChatWS - Mensajeria en Tiempo Real</title>

    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ============================================================
         PANTALLA DE LOGIN / AUTENTICACION
         Autenticacion con Firebase (email/password) o modo demo.
    ============================================================ -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.04 2 11c0 2.52 1.17 4.79 3.04 6.42L4 22l4.36-1.92C9.34 20.36 10.64 20.5 12 20.5c5.52 0 10-4.04 10-9S17.52 2 12 2z"/>
                </svg>
            </div>
            <h1 class="login-title">ChatWS</h1>
            <p class="login-subtitle">Mensajeria en tiempo real con WebSockets</p>

            <!-- Tabs: Login / Registro -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" type="button">Iniciar Sesion</button>
                <button class="auth-tab" id="tab-register" type="button">Registrarse</button>
            </div>

            <!-- Formulario de LOGIN -->
            <form id="login-form" class="login-form">
                <label for="login-email" class="form-label">Correo electronico</label>
                <input
                    type="email"
                    id="login-email"
                    class="form-input"
                    placeholder="usuario@ejemplo.com"
                    autocomplete="email"
                    required
                    aria-label="Correo electronico"
                >

                <label for="login-password" class="form-label">Contrasena</label>
                <input
                    type="password"
                    id="login-password"
                    class="form-input"
                    placeholder="Minimo 6 caracteres"
                    autocomplete="current-password"
                    minlength="6"
                    required
                    aria-label="Contrasena"
                >

                <button type="submit" class="btn-login" id="login-btn">
                    Iniciar Sesion
                </button>
            </form>

            <!-- Formulario de REGISTRO -->
            <form id="register-form" class="login-form hidden">
                <label for="reg-name" class="form-label">Nombre para mostrar</label>
                <input
                    type="text"
                    id="reg-name"
                    class="form-input"
                    placeholder="Ej: Carlos"
                    maxlength="20"
                    autocomplete="name"
                    aria-label="Nombre para mostrar"
                >

                <label for="reg-email" class="form-label">Correo electronico</label>
                <input
                    type="email"
                    id="reg-email"
                    class="form-input"
                    placeholder="usuario@ejemplo.com"
                    autocomplete="email"
                    required
                    aria-label="Correo electronico"
                >

                <label for="reg-password" class="form-label">Contrasena</label>
                <input
                    type="password"
                    id="reg-password"
                    class="form-input"
                    placeholder="Minimo 6 caracteres"
                    autocomplete="new-password"
                    minlength="6"
                    required
                    aria-label="Contrasena"
                >

                <button type="submit" class="btn-login" id="register-btn">
                    Crear Cuenta
                </button>
            </form>

            <p id="login-error" class="login-error" role="alert"></p>

            <!-- Separador -->
            <div class="auth-divider">
                <span>o</span>
            </div>

            <!-- Modo demo (sin Firebase) -->
            <button id="demo-btn" class="btn-demo" type="button">
                Entrar sin cuenta (demo)
            </button>
        </div>
    </div>


    <!-- ============================================================
         PANTALLA PRINCIPAL DEL CHAT
    ============================================================ -->
    <div id="chat-screen" class="chat-screen hidden">

        <!-- ---- BARRA SUPERIOR ---- -->
        <header class="chat-header">
            <div class="header-left">
                <div class="app-logo">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.04 2 11c0 2.52 1.17 4.79 3.04 6.42L4 22l4.36-1.92C9.34 20.36 10.64 20.5 12 20.5c5.52 0 10-4.04 10-9S17.52 2 12 2z"/>
                    </svg>
                </div>
                <div class="app-info">
                    <h1 class="app-name">ChatWS</h1>
                    <div class="connection-status">
                        <span id="status-dot" class="status-dot disconnected"></span>
                        <span id="status-text" class="status-text">Desconectado</span>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="users-counter" title="Usuarios conectados">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span id="users-count">0</span>
                    <span class="users-label">en linea</span>
                </div>

                <button id="theme-toggle" class="theme-toggle" title="Cambiar tema" aria-label="Alternar modo claro/oscuro">
                    <svg id="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h3c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm17 0h3c.55 0 1-.45 1-1s-.45-1-1-1h-3c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v3c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 17v3c0 .55.45 1 1 1s1-.45 1-1v-3c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                    </svg>
                    <svg id="icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none;">
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                </button>

                <button id="logout-btn" class="logout-btn" title="Cerrar sesion" aria-label="Cerrar sesion">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ---- AREA PRINCIPAL ---- -->
        <main class="chat-body">

            <!-- Panel lateral: lista de usuarios conectados -->
            <aside class="sidebar" id="sidebar">
                <h2 class="sidebar-title">Participantes</h2>
                <ul id="users-list" class="users-list">
                </ul>
            </aside>

            <!-- Area central: mensajes -->
            <section class="chat-main">
                <div id="typing-indicator" class="typing-indicator hidden">
                    <span class="typing-dots">
                        <span></span><span></span><span></span>
                    </span>
                    <span id="typing-text"></span>
                </div>

                <div id="messages-container" class="messages-container" role="log" aria-live="polite">
                    <div id="empty-state" class="empty-state">
                        <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" opacity="0.3"/>
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                        </svg>
                        <h3>No hay mensajes aun</h3>
                        <p>Se el primero en escribir algo en esta sala.</p>
                    </div>
                </div>

                <div class="message-bar">
                    <div class="input-wrapper">
                        <textarea
                            id="message-input"
                            class="message-input"
                            placeholder="Escribe un mensaje..."
                            maxlength="500"
                            rows="1"
                            aria-label="Campo de mensaje"
                        ></textarea>
                        <span id="char-counter" class="char-counter">0 / 500</span>
                    </div>
                    <button id="send-btn" class="send-btn" disabled title="Enviar mensaje" aria-label="Enviar mensaje">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- BANNER DE RECONEXION -->
    <div id="reconnect-banner" class="reconnect-banner hidden">
        <span class="reconnect-spinner"></span>
        <span>Conexion perdida. Reconectando...</span>
    </div>

    <!-- ============================================================
         LIBRERIAS EXTERNAS
    ============================================================ -->

    <!-- Firebase SDK (version modular via CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <!-- Cliente Socket.IO (cargado desde el servidor) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Logica del cliente (archivo externo) -->
    <script src="js/chat.js"></script>
</body>
</html>
